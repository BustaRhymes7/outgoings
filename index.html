<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outgoings</title>
<meta name="description" content="Personal spending, bills and income tracker. Data stays on this device.">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1217" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outgoings">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}

/* Layout: iOS-style shell — large title on top, one-screen content, tab bar fixed at the bottom with a centre add button */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sunk:#eaeef2; --line:#dde3e9;
  --fg:#131c25; --muted:#5d6975; --faint:#8d98a3;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#e4ebfc;
  --good:#0f7a4f; --good-soft:#e1f3e9; --warn:#9a5b00; --warn-soft:#fcefd6; --bad:#b3261e; --bad-soft:#fbe6e4;
  --cpf:#0f8a6a; --inv:#b7791f;
  --bar:rgba(255,255,255,.86);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d1217; --surface:#151d25; --sunk:#1c262f; --line:#26323d;
  --fg:#e8eef4; --muted:#9ba8b5; --faint:#6b7986;
  --accent:#7fa3ff; --accent-ink:#0b1320; --accent-soft:#1b2947;
  --good:#5fd39a; --good-soft:#14322a; --warn:#f0b45a; --warn-soft:#382a13; --bad:#ff8a80; --bad-soft:#3a1e1c;
  --cpf:#4fc9a4; --inv:#e0a84a;
  --bar:rgba(21,29,37,.86);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.muted{color:var(--muted)} .small{font-size:.84rem}

/* top bar */
.top{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:var(--sunk)}
.icon-btn[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent)}
.icon-btn svg{width:20px;height:20px}
.eye .i-hide{display:none} .eye[aria-pressed="true"] .i-show{display:none} .eye[aria-pressed="true"] .i-hide{display:block}

main{max-width:640px;margin:0 auto;padding:4px 16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{font-size:1.05rem;font-weight:700}
.link{color:var(--accent);font-weight:600;font-size:.88rem}
.card{background:var(--surface);border-radius:18px;border:1px solid var(--line)}
.list{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}

/* private values */
.pv .pv-m{letter-spacing:.14em;color:var(--faint)} .pv .pv-v{display:none}
body.reveal .pv .pv-v{display:inline} body.reveal .pv .pv-m{display:none}

/* home hero */
.hero{padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(2.3rem,11vw,3rem);line-height:1.05;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.42em;color:var(--muted);font-weight:500;margin-right:3px;vertical-align:.55em}
.pace{position:relative;height:10px;border-radius:5px;background:var(--sunk)}
.pace .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.pace.warn .fill{background:var(--warn)} .pace.over .fill{background:var(--bad)}
.pace .mark{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--fg);opacity:.55}
.pace-t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.84rem;color:var(--muted)}
.pace-t b{color:var(--fg);font-weight:600}
.hero-rows{display:flex;flex-direction:column;border-top:1px solid var(--line);margin:2px -18px -16px}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;font-size:.92rem;width:100%;text-align:left}
.hero-row+.hero-row{border-top:1px solid var(--line)}
.hero-row .num{font-weight:500}
.good{color:var(--good)} .bad{color:var(--bad)}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.list .row+.row{border-top:1px solid var(--line)}
.row .dot{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--muted);background:var(--sunk);letter-spacing:.02em}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .amt .num{font-weight:500}
.row .amt .s{font-size:.75rem}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.due{background:var(--accent-soft);color:var(--accent)} .pill.late{background:var(--bad-soft);color:var(--bad)}
.pay{flex:none;padding:7px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.84rem}

/* categories */
.cats{padding:14px;display:flex;flex-direction:column;gap:11px}
.cat{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;font-size:.9rem}
.cat .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.cat .bar span{display:block;height:100%;border-radius:3px;background:var(--accent)}
.cat.warn .bar span{background:var(--warn)} .cat.over .bar span{background:var(--bad)}
.cat .dl{font-family:var(--f-mono);font-size:.74rem;margin-left:6px}
.cat .of{color:var(--faint);font-size:.8rem}
.catrows{display:flex;flex-direction:column;gap:8px}
.catrow{display:grid;grid-template-columns:1fr 110px;gap:8px}
.catrow input[readonly]{color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;font-size:.92rem}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--accent)}

.empty{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);font-size:.92rem}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:.86rem;text-align:left;width:100%}

/* activity */
.ycal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mt{border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;background:color-mix(in srgb,var(--accent) calc(var(--lvl,0)*55%),var(--sunk))}
.mt .n{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mt .v{font-size:.9rem;font-weight:500}
.mt.future{opacity:.5}
.mt.sel{box-shadow:0 0 0 2px var(--accent) inset}
.mt.sel .n{color:var(--accent)}
.msum{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.msum h2{font-size:1.25rem}
.chips-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips-row::-webkit-scrollbar{display:none}
.chips-row .pill{padding:6px 10px;font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:22px}
.ynav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ynav .yr{display:flex;align-items:center;gap:6px}
.ynav h2{font-size:1.25rem;min-width:2.6em;text-align:center}
.ynav .icon-btn{width:34px;height:34px;border-radius:10px}
.ynav .icon-btn:disabled{opacity:.35;cursor:default}
.daygrp{font-size:.76rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;padding:4px 4px 0}

/* bills */
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.split3{display:grid;grid-template-columns:repeat(3,1fr)}
.split3>div{padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split3>div+div{border-left:1px solid var(--line)}
.split3 .k{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.split3 .v{font-size:clamp(.9rem,4.2vw,1.1rem);font-weight:500;white-space:nowrap}
.split3 .h{font-size:.74rem;color:var(--faint)}
.yoy-link{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border-top:1px solid var(--line);font-size:.86rem;text-align:left}
.grp-h{font-size:.76rem;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:2px 4px 0;display:flex;justify-content:space-between}

/* more */
.set .row{min-height:52px}
.chev{color:var(--faint);flex:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:640px;margin:0 auto;height:var(--tabh);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--faint);height:100%;justify-content:center}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.addbtn{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(31,79,209,.35);margin-top:-10px}
.addbtn svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,10,15,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet>*{flex:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:1.2rem}
.txt-btn{color:var(--accent);font-weight:600;padding:6px 2px}
form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;max-width:100%;display:block}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select{min-height:46px}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
select{-webkit-appearance:none;appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.mono{font-family:var(--f-mono);font-size:13px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:4px 0 0}
.amount span{font-family:var(--f-display);font-size:1.5rem;color:var(--muted);font-weight:500}
.amount input{font-family:var(--f-display);font-weight:700;font-size:2.8rem;border:0;background:transparent;text-align:left;padding:0;width:4.2ch;min-height:0;max-width:80%}
.amount input:focus-visible{outline:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 13px;border-radius:999px;background:var(--sunk);font-size:.88rem;font-weight:500;cursor:pointer}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink)}
.when{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.when input[type=date]{flex:1;min-width:150px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2>*,.grid3>*{min-width:0}
.btn{padding:12px 16px;border-radius:12px;font-weight:600;background:var(--sunk);text-align:center;display:block}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.wide{width:100%}
.btns{display:flex;gap:10px;width:100%}
.btns .btn{flex:1}
.err{color:var(--bad);font-size:.86rem;margin:0}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv div:last-child{border-bottom:0}
.kv div>span:first-child{color:var(--muted)}
table.cmp{width:100%;border-collapse:collapse;font-size:.88rem}
table.cmp th,table.cmp td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;padding-left:0}
table.cmp th{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.cmp td.num{font-family:var(--f-mono)}
table.cmp tr.g td{font-weight:700;border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:50;white-space:nowrap;display:flex;align-items:center;gap:14px}
.toast .undo{color:var(--accent-soft);font-weight:700;padding:2px 0}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Home</h1>
  <button class="icon-btn eye" id="eye" type="button" aria-pressed="false" aria-label="Show private amounts">
    <svg class="i-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <svg class="i-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.9 0 3.5-.6 4.9-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</header>
<main id="view"></main>
<div class="tabbar"><nav aria-label="Sections">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Home</button>
  <button class="tab" data-tab="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Activity</button>
  <button class="addbtn" id="add" aria-label="Add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  <button class="tab" data-tab="bills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8.5h6M9 12h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Bills</button>
  <button class="tab" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor"/></svg>More</button>
</nav></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= constants & state ================= */
let YEAR=new Date().getFullYear();
const CATS=["Food","Groceries","Transport","Shopping","Bills","Insurance","Subscriptions","Health","Fun","Other"];
const METHODS=["Card","Apple Pay","PayNow","Cash","GIRO"];
const INCOME_TYPES=["Salary","Bonus","Other"];
const FREQ={weekly:{n:52,label:"Weekly"},monthly:{n:12,label:"Monthly"},quarterly:{n:4,label:"Quarterly"},halfyearly:{n:2,label:"Half-yearly"},yearly:{n:1,label:"Yearly"}};
const KIND={insurance:"Insurance",subscription:"Subscription",bill:"Bill"};
const KEY="outgoings.v1";
const cats=()=>{const c=S.settings.cats;return Array.isArray(c)&&c.length?c:CATS};
const S={q:"",actYear:null,tab:"home",items:[],expenses:[],income:[],rules:{},skippedTaps:[],settings:{},lastBackup:null,storageOK:true,period:"year",actMonth:null};
try{const t=localStorage.getItem("og-tab2");if(["home","activity","bills","more"].includes(t))S.tab=t;S.period=localStorage.getItem("og-period")==="month"?"month":"year"}catch(e){}

/* ================= helpers ================= */
const nf=new Intl.NumberFormat("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat("en-SG",{maximumFractionDigits:0});
const money=v=>nf.format(Math.round((+v||0)*100)/100);
const r2=v=>Math.round((+v||0)*100)/100;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const today=()=>ymd(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const mkey=m=>String(m||"").toLowerCase().replace(/\s+/g," ").trim();
const newId=()=>{try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}};
const monthName=(k,f="long")=>{const[y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("en-SG",{month:f})};
function fmtDate(s){if(!s)return"";const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-SG",{day:"numeric",month:"short",year:d.getFullYear()!==YEAR?"numeric":undefined})}
function dayLabel(s){if(s===today())return"Today";if(s===yesterday())return"Yesterday";return new Date(s+"T00:00:00").toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"})}
function daysUntil(s){if(!s)return null;return Math.round((new Date(s+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5)}
function advance(s,freq,dir=1){const d=new Date(s+"T00:00:00");if(freq==="weekly")d.setDate(d.getDate()+7*dir);else{const m=({monthly:1,quarterly:3,halfyearly:6,yearly:12}[freq]||12)*dir;const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return ymd(d)}
const pv=(html,mask="S$••••")=>`<span class="pv"><span class="pv-v">${html}</span><span class="pv-m">${mask}</span></span>`;
const short=v=>v>=10000?Math.round(v/1000)+"k":v>=1000?(Math.round(v/100)/10)+"k":nf0.format(v);
const initials=c=>esc((c||"?").replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase()||"?");
function toast(m,undo){const t=document.getElementById("toast");t.innerHTML=`<span>${esc(m)}</span>`+(undo?`<button class="undo" type="button" data-undo>Undo</button>`:"");toast._undo=undo||null;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;toast._undo=null},undo?5000:2200)}

/* bills maths */
function split(it){const s=it.split||{};const has=s.cash!=null||s.medisave!=null||s.investment!=null;return has?{cash:+s.cash||0,medisave:+s.medisave||0,investment:+s.investment||0}:{cash:+it.amount||0,medisave:0,investment:0}}
const freqN=it=>(FREQ[it.frequency]||FREQ.yearly).n;
const yearlyBy=(it,k)=>split(it)[k]*freqN(it);
function totals(list){const t={cash:0,medisave:0,investment:0};list.forEach(i=>{t.cash+=yearlyBy(i,"cash");t.medisave+=yearlyBy(i,"medisave");t.investment+=yearlyBy(i,"investment")});return t}
function prevTotals(list){const p={cash:0,medisave:0,investment:0};list.forEach(i=>{if(i.prev){p.cash+=+i.prev.cash||0;p.medisave+=+i.prev.medisave||0;p.investment+=+i.prev.investment||0}});return p}
const isInvest=it=>{const s=split(it);return s.investment>0&&s.cash+s.medisave===0};
const P=v=>S.period==="month"?v/12:v;
function dueChip(it){const d=daysUntil(it.nextDue);if(d==null)return"";if(d<0)return`<span class="pill late">Overdue</span>`;if(d===0)return`<span class="pill late">Due today</span>`;if(d<=30)return`<span class="pill due">In ${d} day${d===1?"":"s"}</span>`;return`<span class="pill">${fmtDate(it.nextDue)}</span>`}

/* spending maths */
const inMonth=(list,k)=>list.filter(e=>(e.date||"").startsWith(k));
const sum=(l,f="amount")=>l.reduce((a,e)=>a+(+e[f]||0),0);
function byCat(l){const m={};l.forEach(e=>m[e.category||"Other"]=(m[e.category||"Other"]||0)+(+e.amount||0));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function usualMonth(){const now=ym(new Date()),m={};S.expenses.forEach(e=>{const k=(e.date||"").slice(0,7);if(k&&k<now)m[k]=(m[k]||0)+(+e.amount||0)});const v=Object.keys(m).sort().slice(-6).map(k=>m[k]);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function catOrder(){const c={};S.expenses.slice(-200).forEach(e=>c[e.category]=(c[e.category]||0)+1);return[...cats()].sort((a,b)=>(c[b]||0)-(c[a]||0))}
/* bills expected in a month that haven't been logged as paid */
function expectedIn(k){const out=[];S.items.forEach(it=>{const cash=split(it).cash;if(!(cash>0))return;const f=it.frequency||"yearly";
  if(!it.nextDue){if(f==="monthly")out.push({it,amt:cash});return}
  let i=0;while(advance(it.nextDue,f,i)>k+"-99"&&i>-600)i--;while(advance(it.nextDue,f,i)<k+"-00"&&i<600)i++;
  const d=advance(it.nextDue,f,i);if(d.startsWith(k)&&!S.expenses.some(e=>e.itemId===it.id&&(e.date||"").startsWith(k)))out.push({it,amt:cash,date:d})});return out}

/* ================= storage (this device only) ================= */
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,savedAt:Date.now(),lastBackup:S.lastBackup,items:S.items,expenses:S.expenses,income:S.income,rules:S.rules,skippedTaps:S.skippedTaps,settings:S.settings}));S.storageOK=true;return true}catch(e){S.storageOK=false;return false}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const d=JSON.parse(raw);const A=x=>Array.isArray(x)?x:[];
  S.items=A(d.items);S.expenses=A(d.expenses);S.income=A(d.income);S.rules=d.rules&&typeof d.rules==="object"?d.rules:{};S.skippedTaps=A(d.skippedTaps);S.settings=d.settings&&typeof d.settings==="object"?d.settings:{};S.lastBackup=d.lastBackup||null}catch(e){S.storageOK=false}}
function save(msg,undo){const ok=persist();closeSheet();render();toast(ok?msg:"Couldn't save on this device. Export a backup.",ok?undo:null)}
/* delete with a few seconds to undo; the entry goes back where it was */
function remove(list,id){const i=S[list].findIndex(x=>x.id===id);if(i<0)return;const[gone]=S[list].splice(i,1);
  save("Deleted",()=>{S[list].splice(Math.min(i,S[list].length),0,gone);const ok=persist();render();toast(ok?"Restored":"Couldn't save on this device. Export a backup.")})}
const backupAge=()=>S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;

/* ================= views ================= */
const TITLES={activity:"Activity",bills:"Bills",more:"More"};
function render(){
  document.getElementById("title").textContent=S.tab==="home"?new Date().toLocaleDateString("en-SG",{month:"long"}):TITLES[S.tab];
  document.querySelectorAll(".tab").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  document.getElementById("view").innerHTML={home:vHome,activity:vActivity,bills:vBills,more:vMore}[S.tab]();
}
function expRow(e,withDate){const sub=[withDate&&fmtDate(e.date),e.category,e.method].filter(Boolean).join(" · ");
  return `<button class="row" data-exp="${esc(e.id)}"><span class="dot">${initials(e.category)}</span><span class="main"><span class="t">${esc(e.note||e.category)}</span><span class="s">${esc(sub)}</span></span><span class="amt"><span class="num">S$${money(e.amount)}</span></span></button>`}

function vHome(){
  const k=ym(new Date()), mine=inMonth(S.expenses,k), spent=sum(mine);
  const d=new Date(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(), frac=d.getDate()/dim, left=dim-d.getDate();
  const budget=+S.settings.budget||0, usual=usualMonth(), target=budget||usual;
  let pace;
  if(target){const pct=Math.min(100,spent/target*100), cls=spent>target?"over":spent>target*frac*1.1?"warn":"";
    pace=`<div class="pace ${cls}"><div class="fill" style="width:${pct}%"></div><div class="mark" style="left:${(frac*100).toFixed(1)}%"></div></div>
    <div class="pace-t"><span>${budget?(spent<=budget?`<b class="num">S$${money(budget-spent)}</b> left of S$${nf0.format(budget)}`:`<b class="num bad">S$${money(spent-budget)}</b> over budget`):`Usual month <b class="num">S$${nf0.format(usual)}</b>`}</span><span>${left} day${left===1?"":"s"} left</span></div>`}
  else pace=`<div class="pace-t"><span>${S.expenses.length?"Set a budget to see your pace.":"Tap + to log your first spend."}</span>${S.expenses.length?`<button class="link" data-go="more">Set budget</button>`:""}</div>`;
  const pk=ym(new Date(d.getFullYear(),d.getMonth()-1,1)), pdim=new Date(d.getFullYear(),d.getMonth(),0).getDate();
  const prevAll=inMonth(S.expenses,pk), hasPrev=prevAll.length>0, prevSoFar=prevAll.filter(e=>e.date<=pk+"-"+pad(Math.min(d.getDate(),pdim))), dPrev=r2(spent-sum(prevSoFar));
  const due=sum(expectedIn(k),"amt"), inc=sum(inMonth(S.income,k),"net"), rest=inc-spent-due;
  const rows=[hasPrev?`<div class="hero-row"><span>vs this time last month</span><span class="num ${dPrev>0?"bad":dPrev<0?"good":""}">${Math.abs(dPrev)<.01?"Same":`S$${money(Math.abs(dPrev))} ${dPrev>0?"more":"less"}`}</span></div>`:"",
    due?`<button class="hero-row" data-go="bills"><span>Bills still due this month</span><span class="num">S$${money(due)}</span></button>`:"",
    inc?`<div class="hero-row"><span>Left from salary</span><span class="num ${rest>=0?"good":"bad"}">${pv((rest<0?"−":"")+"S$"+money(Math.abs(rest)))}</span></div>`:""].join("");
  const hero=`<div class="card hero"><div><div class="lbl">Spent so far</div><div class="big"><small>S$</small>${money(spent)}</div></div>${pace}${rows?`<div class="hero-rows">${rows}</div>`:""}</div>`;

  const up=S.items.filter(i=>i.nextDue&&daysUntil(i.nextDue)<=30).sort((a,b)=>a.nextDue.localeCompare(b.nextDue)).slice(0,3);
  const noDue=S.items.filter(i=>!i.nextDue&&(i.frequency||"yearly")!=="monthly").length;
  const upHtml=up.length?`<div class="list">${up.map(i=>{const s=split(i);return`<div class="row"><span class="dot">${initials(i.provider||i.name)}</span><span class="main"><span class="t">${esc(i.name)}</span><span class="s">S$${money(s.cash||s.medisave||s.investment)} · ${dueChip(i).replace(/<[^>]+>/g,"")}</span></span><button class="pay" data-paid="${esc(i.id)}">Paid</button></div>`}).join("")}</div>`
    :noDue?`<button class="nudge" data-go="bills"><span>${noDue} bill${noDue===1?" has":"s have"} no due date, so you won't get reminded.</span><span aria-hidden="true">›</span></button>`:"";
  const cb=S.settings.catBudgets||{}, spentBy=Object.fromEntries(byCat(mine)), prevBy=Object.fromEntries(byCat(prevSoFar));
  const capped=Object.keys(cb).filter(c=>cb[c]>0).sort((a,b)=>(spentBy[b]||0)/cb[b]-(spentBy[a]||0)/cb[a]), free=byCat(mine).filter(([c])=>!(cb[c]>0)).slice(0,4).map(x=>x[0]);
  const top=Math.max(1,...free.map(c=>spentBy[c]));
  const catRow=c=>{const v=spentBy[c]||0,b=+cb[c]||0,dl=r2(v-(prevBy[c]||0)),cls=b?(v>b?"over":v>b*frac*1.1?"warn":""):"";
    return `<div class="cat ${cls}"><span>${esc(c)}${hasPrev&&Math.abs(dl)>=1?`<span class="dl ${dl>0?"bad":"good"}">${dl>0?"+":"−"}${nf0.format(Math.abs(dl))}</span>`:""}</span><span class="num">S$${money(v)}${b?`<span class="of"> / ${nf0.format(b)}</span>`:""}</span><div class="bar"><span style="width:${Math.min(100,b?v/b*100:v/top*100)}%"></span></div></div>`};
  const catList=[...capped,...free];
  const catHtml=catList.length?`<div class="list cats">${catList.map(catRow).join("")}</div>${hasPrev?`<p class="muted small" style="margin:0 4px">+/− compares with the same day last month.</p>`:""}`:"";
  const recent=[...S.expenses].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)).slice(0,5);
  const age=backupAge(), n=S.expenses.length+S.items.length+S.income.length;
  const nb=!S.storageOK?`<button class="nudge" data-act="export"><span>Storage is blocked, so changes won't last. Export a backup now.</span><span>›</span></button>`
    :(n&&(age==null||age>=30))?`<button class="nudge" data-act="export"><span>${age==null?"No backup yet.":`Last backup ${age} days ago.`} Your data only lives on this phone.</span><span>Back up ›</span></button>`:"";
  return `${hero}${nb}
    ${upHtml?`<section><div class="sh"><h2>Coming up</h2>${up.length?`<button class="link" data-go="bills">All bills</button>`:""}</div>${upHtml}</section>`:""}
    ${catHtml?`<section><div class="sh"><h2>Where it went</h2><button class="link" data-go="activity">Details</button></div>${catHtml}</section>`:""}
    <section><div class="sh"><h2>Recent</h2>${recent.length?`<button class="link" data-go="activity">See all</button>`:""}</div>
    ${recent.length?`<div class="list">${recent.map(e=>expRow(e)).join("")}</div>`:`<div class="list empty"><p>Nothing logged yet. Tap <b>+</b> whenever you pay for something. It takes a few seconds.</p>${!S.items.length?`<button class="link" data-act="restore">Restore from a backup instead</button>`:""}</div>`}</section>`;
}

function actYears(){let lo=YEAR;S.expenses.forEach(e=>{const y=parseInt((e.date||"").slice(0,4),10);if(y>1900&&y<lo)lo=y});return{lo,hi:YEAR}}
function vActivity(){
  return `<section><input type="search" id="act-q" value="${esc(S.q)}" placeholder="Search notes, categories, amounts" enterkeyhint="search" autocomplete="off" aria-label="Search spending"></section>
    <div class="stack" id="act-body">${actBody()}</div>`;
}
const actBody=()=>S.q.trim()?searchBody():yearBody();
function searchBody(){
  const terms=S.q.trim().toLowerCase().split(/\s+/);
  const hits=S.expenses.filter(e=>{const h=[e.note,e.category,e.method,money(e.amount),String(e.amount)].join(" ").toLowerCase();return terms.every(t=>h.includes(t))})
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
  if(!hits.length)return `<section><div class="list empty"><p>Nothing matches “${esc(S.q.trim())}”.</p></div></section>`;
  const months={};hits.forEach(e=>(months[(e.date||"").slice(0,7)]??=[]).push(e));
  return `<section><div class="msum"><h2>${hits.length} match${hits.length===1?"":"es"}</h2><span class="num">S$${money(sum(hits))}</span></div>
    ${Object.entries(months).map(([k,es])=>`<div class="daygrp"><span>${/^\d{4}-\d{2}$/.test(k)?monthName(k)+" "+k.slice(0,4):"No date"}</span><span class="num">S$${money(sum(es))}</span></div><div class="list">${es.map(e=>expRow(e,true)).join("")}</div>`).join("")}</section>`;
}
function yearBody(){
  const{lo,hi}=actYears();if(S.actYear==null||S.actYear<lo||S.actYear>hi)S.actYear=hi;const y=S.actYear;
  const nowI=y===YEAR?new Date().getMonth():11;
  if(S.actMonth==null||S.actMonth>11)S.actMonth=nowI;
  const tot=[...Array(12)].map((_,i)=>{const k=y+"-"+pad(i+1);return i>nowI?sum(expectedIn(k),"amt"):sum(inMonth(S.expenses,k))}), max=Math.max(...tot,1);
  const mn=(i,f)=>new Date(y,i,1).toLocaleDateString("en-SG",{month:f});
  const tiles=tot.map((v,i)=>`<button class="mt${i>nowI?" future":""}${i===S.actMonth?" sel":""}" data-am="${i}" style="--lvl:${v?Math.max(.15,v/max).toFixed(3):0}" aria-label="${mn(i,"long")}"><span class="n">${mn(i,"short")}</span><span class="v num">${v?short(v):"·"}</span></button>`).join("");
  const chevron=d=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const ynav=lo<hi?`<div class="ynav"><div class="yr"><button class="icon-btn" data-ay="${y-1}" aria-label="${y-1}" ${y<=lo?"disabled":""}>${chevron("m15 6-6 6 6 6")}</button><h2>${y}</h2><button class="icon-btn" data-ay="${y+1}" aria-label="${y+1}" ${y>=hi?"disabled":""}>${chevron("m9 6 6 6-6 6")}</button></div><span class="num muted">S$${money(sum(S.expenses.filter(e=>(e.date||"").startsWith(y+"-"))))} spent</span></div>`:"";
  const k=y+"-"+pad(S.actMonth+1);
  let body;
  if(S.actMonth>nowI){const ex=expectedIn(k);body=`<div class="msum"><h2>${monthName(k)}</h2><span class="num muted">S$${money(sum(ex,"amt"))} expected</span></div>
    ${ex.length?`<div class="list">${ex.map(x=>`<button class="row" data-bill="${esc(x.it.id)}"><span class="dot">${initials(x.it.provider||x.it.name)}</span><span class="main"><span class="t">${esc(x.it.name)}</span><span class="s">${x.date?"Due "+fmtDate(x.date):"Monthly"}</span></span><span class="amt"><span class="num">S$${money(x.amt)}</span></span></button>`).join("")}</div>`:`<div class="list empty"><p>No bills expected in ${monthName(k)}.</p></div>`}`}
  else{const l=inMonth(S.expenses,k).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)), days={};l.forEach(e=>(days[e.date]??=[]).push(e));const cats=byCat(l);
    body=`<div class="msum"><h2>${monthName(k)}${y!==YEAR?" "+y:""}</h2><span class="num">S$${money(sum(l))}</span></div>
    ${cats.length?`<div class="chips-row">${cats.map(([c,v])=>`<span class="pill">${esc(c)} <span class="num">S$${nf0.format(v)}</span></span>`).join("")}</div>`:""}
    ${l.length?Object.entries(days).map(([d,es])=>`<div class="daygrp"><span>${dayLabel(d)}</span><span class="num">S$${money(sum(es))}</span></div><div class="list">${es.map(e=>expRow(e)).join("")}</div>`).join(""):`<div class="list empty"><p>Nothing logged in ${monthName(k)}${y!==YEAR?" "+y:""}.</p></div>`}`}
  return `<section>${ynav}<div class="ycal">${tiles}</div></section><section>${body}</section>`;
}

function vBills(){
  const all=S.items, ins=all.filter(i=>i.kind==="insurance"&&!isInvest(i)), inv=all.filter(isInvest), subs=all.filter(i=>i.kind!=="insurance"&&!isInvest(i));
  if(!all.length)return `<section><div class="list empty"><p>Add your insurance and subscriptions to see what's committed each year and get reminded before they're due.</p><div class="btns"><button class="btn primary" data-act="new-bill">Add a bill</button><button class="btn" data-act="sheet-import">Import sheet</button></div></div></section>`;
  const t=totals(all), p=prevTotals(all), per=S.period==="month"?"a month":"a year", dc=r2(t.cash-p.cash), hasPrev=all.some(i=>i.prev);
  const seg=`<div class="seg" role="group" aria-label="Show amounts"><button data-period="year" aria-pressed="${S.period==="year"}">Yearly</button><button data-period="month" aria-pressed="${S.period==="month"}">Monthly</button></div>`;
  const summary=`<div class="card"><div class="split3">
    <div><span class="k">Cash</span><span class="v num">S$${money(P(t.cash))}</span><span class="h">${per}</span></div>
    <div><span class="k" style="color:var(--cpf)">CPF</span><span class="v num">S$${money(P(t.medisave))}</span><span class="h">not spending</span></div>
    <div><span class="k" style="color:var(--inv)">Invested</span><span class="v num">S$${money(P(t.investment))}</span><span class="h">not spending</span></div></div>
    ${hasPrev?`<button class="yoy-link" data-act="compare"><span>Cash vs ${YEAR-1}: <b class="num ${dc>0?"bad":"good"}">${dc>=0?"+":"−"}S$${money(Math.abs(P(dc)))}</b>${p.cash?` <span class="muted">(${dc>=0?"+":"−"}${Math.abs(Math.round(dc/p.cash*100))}%)</span>`:""}</span><span class="link">Compare ›</span></button>`:""}</div>`;
  const row=i=>{const s=split(i),main=s.cash||s.medisave||s.investment,src=s.cash?"":s.medisave?"CPF":"Invested";
    return `<button class="row" data-bill="${esc(i.id)}"><span class="dot">${initials(i.provider||i.name)}</span><span class="main"><span class="t">${esc(i.name)}</span><span class="s">${esc(i.provider||KIND[i.kind]||"")}${s.cash&&s.medisave?` · +S$${money(P(s.medisave*freqN(i)))} CPF`:""}${src?` · ${src}`:""}</span></span><span class="amt"><span class="num">S$${money(P(main*freqN(i)))}</span>${dueChip(i)||`<span class="s">no due date</span>`}</span></button>`};
  const grp=(h,l)=>{if(!l.length)return"";const g=totals(l);return`<section><div class="grp-h"><span>${h}</span><span class="num">S$${money(P(g.cash+g.medisave+g.investment))}</span></div><div class="list">${[...l].sort((a,b)=>(a.order??99)-(b.order??99)||yearlyBy(b,"cash")-yearlyBy(a,"cash")).map(row).join("")}</div></section>`};
  return `<section><div class="sh">${seg}<button class="link" data-act="new-bill">＋ Add</button></div>${summary}</section>
    ${grp("Insurance",ins)}${grp("Subscriptions & bills",subs)}${grp("Investments",inv)}`;
}

function vMore(){

function billCat(it){const c=it.category||(it.kind==="insurance"?"Insurance":it.kind==="bill"?"Bills":"Subscriptions");return cats().includes(c)?c:"Other"}
/* bills set to log themselves: add every payment whose due date has arrived, then move the due date on */
function autoLog(){const t=today();let n=0;S.items.forEach(it=>{if(!it.auto||!it.nextDue)return;const cash=r2(split(it).cash);let g=0;
  while(it.nextDue<=t&&g++<120){if(cash>0){S.expenses.push({id:newId(),amount:cash,category:billCat(it),note:it.name,date:it.nextDue,method:it.method||"GIRO",itemId:it.id,auto:true,createdAt:Date.now()});n++}
    it.lastPaid=it.nextDue;it.nextDue=advance(it.nextDue,it.frequency||"yearly")}});return n}

  if(s.cash>0)S.expenses.push({id:newId(),amount:r2(s.cash),category:billCat(it),note:it.name,date:today(),method:it.method||"GIRO",itemId:id,createdAt:Date.now()});
  it.nextDue=advance(it.nextDue||today(),it.frequency||"yearly");it.lastPaid=today();save("Marked paid")}

function compareSheet(){
  const all=S.items,t=totals(all),p=prevTotals(all),py=YEAR-1;
  const chg=(a,b)=>{const d=r2(b-a);return Math.abs(d)<.01?`<td class="num muted">—</td>`:`<td class="num ${d>0?"bad":"good"}">${d>0?"+":"−"}${money(Math.abs(d))}</td>`};
  const r=(l,a,b)=>`<tr><td>${l}</td><td class="num">${money(a)}</td><td class="num">${money(b)}</td>${chg(a,b)}</tr>`;
  const rows=all.filter(i=>i.prev).sort((a,b)=>(a.order??99)-(b.order??99)).map(i=>r(esc(i.name),(+i.prev.cash||0)+(+i.prev.medisave||0)+(+i.prev.investment||0),yearlyBy(i,"cash")+yearlyBy(i,"medisave")+yearlyBy(i,"investment"))).join("");
  openSheet(`<div class="sheet-h"><h2>${py} vs ${YEAR}</h2><button class="txt-btn" data-close>Done</button></div>
  <div style="overflow-x:auto"><table class="cmp"><thead><tr><th>Paid from</th><th>${py}</th><th>${YEAR}</th><th>Change</th></tr></thead><tbody>
    ${r("Cash",p.cash,t.cash)}${r("CPF Medisave",p.medisave,t.medisave)}${r("Invested",p.investment,t.investment)}
    <tr class="g"><td>All</td><td class="num">${money(p.cash+p.medisave+p.investment)}</td><td class="num">${money(t.cash+t.medisave+t.investment)}</td>${chg(p.cash+p.medisave+p.investment,t.cash+t.medisave+t.investment)}</tr></tbody></table></div>
  <h3 style="font-size:.95rem">By plan</h3>
  <div style="overflow-x:auto"><table class="cmp"><thead><tr><th>Plan</th><th>${py}</th><th>${YEAR}</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

/* ---- imports & backup ---- */
function csvRows(txt){const rows=[];let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}return rows}
const amt=v=>{const n=parseFloat(String(v||"").replace(/[^0-9.\-]/g,""));return isFinite(n)?r2(n):0};
function parseSheet(txt){const rows=csvRows(txt.replace(/^﻿/,""));if(rows.length<3)return[];
  const yrs=(rows[0]||[]).map(x=>parseInt(x,10)).filter(n=>n>1900),prevY=yrs[0]||YEAR-1,out=[];let ins="",pol="",order=0;
  for(const r of rows.slice(2)){const c=i=>String(r[i]??"").trim();if(/^total/i.test(c(0)))break;if(c(0)){ins=c(0);pol=""}if(c(1))pol=c(1);const name=c(2);if(!name)continue;
    const cur={cash:amt(c(8)),medisave:amt(c(9)),investment:amt(c(10))};
    out.push({kind:"insurance",name,provider:ins,ref:pol,cover:amt(c(3))||null,frequency:"yearly",split:cur,amount:r2(cur.cash+cur.medisave+cur.investment),prev:{year:prevY,cash:amt(c(4)),medisave:amt(c(5)),investment:amt(c(6))},note:c(11)||c(7)||"",order:++order})}
  return out}
function fileSheet(title,help,accept,onText){
  openSheet(`<div class="sheet-h"><h2>${title}</h2><button class="txt-btn" data-close>Cancel</button></div>
    <p class="muted small" style="margin:0">${help}</p>
    <label class="btn wide" style="cursor:pointer">Choose file<input id="fs-file" type="file" accept="${accept}" hidden></label>
    <details><summary class="muted small">Or paste the text</summary><textarea id="fs-text" class="mono" rows="5" style="margin-top:8px"></textarea><button class="btn wide" type="button" id="fs-go" style="margin-top:8px">Use pasted text</button></details>
    <p class="err" id="fs-err" hidden></p><div id="fs-out" style="display:flex;flex-direction:column;gap:12px"></div>`);
  const err=m=>{const e=document.getElementById("fs-err");e.textContent=m||"";e.hidden=!m};
  document.getElementById("fs-file").addEventListener("change",async ev=>{const f=ev.target.files[0];if(!f)return;try{onText(await f.text(),err)}catch(x){err("Couldn't read that file.")}});
  document.getElementById("fs-go").addEventListener("click",()=>onText(document.getElementById("fs-text").value,err));
}
function sheetImport(){fileSheet("Import insurance","In Google Sheets choose <b>File → Download → Comma-separated values</b>, then pick that file. Plans are matched by insurer and name, so due dates you've set are kept.",".csv,text/csv,text/plain",(txt,err)=>{
  const list=parseSheet(txt||"");if(!list.length)return err("Couldn't find any plans. Make sure it's the Insurance Summary sheet saved as CSV.");err("");
  const key=i=>mkey(i.provider)+"|"+mkey(i.name),have=new Map(S.items.filter(i=>i.kind==="insurance").map(i=>[key(i),i])),t=totals(list),nNew=list.filter(i=>!have.has(key(i))).length;
  document.getElementById("fs-out").innerHTML=`<div class="kv"><div><span>Plans</span><span>${list.length} (${nNew} new)</span></div><div><span>Cash ${YEAR}</span><span class="num">S$${money(t.cash)}</span></div><div><span>CPF · Invested</span><span class="num">S$${money(t.medisave)} · S$${money(t.investment)}</span></div></div><button class="btn primary wide" id="fs-save">Import ${list.length} plans</button>`;
  document.getElementById("fs-save").onclick=()=>{S.items=[...S.items.filter(i=>!(i.kind==="insurance"&&list.some(l=>key(l)===key(i)))),...list.map(l=>{const o=have.get(key(l));let row={...l};
    if(o&&o.frequency&&o.frequency!=="yearly"){const n=freqN(o);row.frequency=o.frequency;row.split={cash:r2(l.split.cash/n),medisave:r2(l.split.medisave/n),investment:r2(l.split.investment/n)};row.amount=r2(l.amount/n)}
    return{...row,id:o?.id||newId(),nextDue:o?.nextDue||"",lastPaid:o?.lastPaid,note:l.note||o?.note||""}})];S.tab="bills";save(`Imported ${list.length} plans`)}})}
function parseTaps(txt){const out=[];txt.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;const p=line.split("|").map(x=>x.trim());if(p.length<3)return;const[when,merchant,a,card]=p,v=parseFloat(String(a).replace(/[^0-9.\-]/g,""));if(!(v>0))return;
  const d=new Date(when),date=isNaN(d)?(when.match(/\d{4}-\d{2}-\d{2}/)||[today()])[0]:ymd(d);out.push({date,merchant:merchant||"Apple Pay",amount:r2(v),card:card||"",importKey:"ap:"+when+"|"+r2(v)+"|"+mkey(merchant)})});return out}
function applePayImport(){fileSheet("Import Apple Pay","Pick the <b>Outgoings Apple Pay.txt</b> file your Shortcut writes. Taps you've already imported are skipped.",".txt,text/plain",(txt,err)=>{
  const all=parseTaps(txt||""),seen=new Set([...S.expenses.map(e=>e.importKey).filter(Boolean),...S.skippedTaps]),fresh=all.filter(t=>!seen.has(t.importKey));
  if(!all.length)return err("No Apple Pay taps found in that file.");err("");
  if(!fresh.length){document.getElementById("fs-out").innerHTML=`<p class="muted" style="margin:0">All ${all.length} taps are already imported.</p>`;return}
  document.getElementById("fs-out").innerHTML=`<p style="margin:0"><b>${fresh.length} new tap${fresh.length===1?"":"s"}.</b> Check categories, then import.</p><div class="list">${fresh.map((t,i)=>`<div class="row"><span class="main"><span class="t">${esc(t.merchant)}</span><span class="s">S$${money(t.amount)} · ${fmtDate(t.date)}</span></span><select id="ap-${i}" style="width:auto;min-height:38px;padding:6px 30px 6px 10px" aria-label="Category">${["Skip",...cats()].map(c=>`<option ${c===(S.rules[mkey(t.merchant)]||"Other")?"selected":""}>${c}</option>`).join("")}</select></div>`).join("")}</div><button class="btn primary wide" id="ap-save">Import</button>`;
  document.getElementById("ap-save").onclick=()=>{let n=0;fresh.forEach((t,i)=>{const c=document.getElementById("ap-"+i).value;if(c==="Skip"){S.skippedTaps.push(t.importKey);return}S.rules[mkey(t.merchant)]=c;n++;
    S.expenses.push({id:newId(),amount:t.amount,category:c,note:t.merchant,date:t.date,method:"Apple Pay",card:t.card,importKey:t.importKey,createdAt:Date.now()})});save(`Imported ${n} tap${n===1?"":"s"}`)}})}
const backupJSON=()=>JSON.stringify({app:"outgoings",version:1,exportedAt:new Date().toISOString(),items:S.items,expenses:S.expenses,income:S.income,rules:S.rules,skippedTaps:S.skippedTaps,settings:S.settings},null,2);
function exportBackup(){shareFile(new Blob([backupJSON()],{type:"application/json"}),`outgoings-backup-${today()}.json`,"Outgoings backup",()=>{S.lastBackup=Date.now();persist();render();toast("Backup saved")})}
/* spreadsheet copy of spending and income; text cells that look like formulas are defused */
function exportCSV(){if(!S.expenses.length&&!S.income.length)return toast("Nothing to export yet");
  const cell=v=>{let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return/[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[...S.expenses.map(e=>[e.date,"Spend",r2(e.amount).toFixed(2),e.category,e.note,e.method]),...S.income.map(e=>[e.date,"Income",r2(e.net).toFixed(2),e.type||"Salary",e.note,""])].sort((a,b)=>String(b[0]||"").localeCompare(String(a[0]||"")));
  const csv="\ufeff"+[["Date","Type","Amount","Category","Note","Paid with"],...rows].map(r=>r.map(cell).join(",")).join("\r\n");
  shareFile(new Blob([csv],{type:"text/csv"}),`outgoings-${today()}.csv`,"Outgoings spending",()=>toast("Spreadsheet saved"))}
function shareFile(blob,name,title,done){let file=null;try{file=new File([blob],name,{type:blob.type})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title}).then(done).catch(x=>{if(x&&x.name!=="AbortError")download(blob,name,done)});return}
  download(blob,name,done)}
function download(blob,name,done){try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);done()}catch(e){toast("Couldn't export here")}}
function restore(){fileSheet("Restore from backup","Pick a backup file you exported. This <b>replaces</b> everything currently on this phone.",".json,application/json,text/plain",(txt,err)=>{
  let d;try{d=JSON.parse(txt)}catch(x){return err("That isn't a valid backup file.")}if(!d||(!Array.isArray(d.items)&&!Array.isArray(d.expenses)))return err("That doesn't look like an Outgoings backup.");err("");
  const c=a=>(Array.isArray(a)?a:[]).filter(r=>r&&typeof r==="object").map(r=>({...r,id:String(r.id||newId())}));
  document.getElementById("fs-out").innerHTML=`<div class="kv"><div><span>Bills</span><span>${c(d.items).length}</span></div><div><span>Spending entries</span><span>${c(d.expenses).length}</span></div><div><span>Income entries</span><span>${c(d.income).length}</span></div></div><button class="btn primary wide" id="rs-go">Replace and restore</button>`;
  document.getElementById("rs-go").onclick=()=>{S.items=c(d.items);S.expenses=c(d.expenses);S.income=c(d.income);S.rules=d.rules&&typeof d.rules==="object"?d.rules:{};S.skippedTaps=Array.isArray(d.skippedTaps)?d.skippedTaps:[];if(d.settings&&typeof d.settings==="object")S.settings=d.settings;S.tab="home";save("Restored")}})}

function twoTap(btn,fn){if(btn.dataset.armed)return fn();btn.dataset.armed="1";const t=btn.textContent;btn.textContent="Tap again to delete";setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=t}},3000)}

/* ================= events ================= */
function go(tab){if(tab!==S.tab)S.q="";S.tab=tab;try{localStorage.setItem("og-tab2",tab)}catch(e){}render();window.scrollTo({top:0})}
document.addEventListener("click",e=>{
  const T=s=>e.target.closest(s), q=(s,a)=>{const el=T(s);return el?el.dataset[a]:undefined};
  if(T("[data-undo]")){const u=toast._undo;toast._undo=null;document.getElementById("toast").hidden=true;return u&&u()}
  if(e.target.id==="scrim")return closeSheet();
  if(T("[data-close]"))return closeSheet();
  let v;
  if(T(".tab"))return go(T(".tab").dataset.tab);
  if(T("#add"))return addSheet();
  if((v=q("[data-go]","go"))){closeSheet();return go(v)}
  if((v=q("[data-period]","period"))){S.period=v;try{localStorage.setItem("og-period",v)}catch(x){}return render()}
  if((v=q("[data-am]","am"))!==undefined){S.actMonth=+v;return render()}
  if((v=q("[data-ay]","ay"))!==undefined){const y=+v;S.actYear=y;S.actMonth=y===YEAR?new Date().getMonth():11;return render()}
  if((v=q("[data-exp]","exp")))return editExpense(v);
  if((v=q("[data-inc]","inc")))return incomeSheet(v);
  if((v=q("[data-bill]","bill")))return billSheet(v);
  if((v=q("[data-edit-bill]","editBill")))return editBill(v);
  if((v=q("[data-confirm-paid]","confirmPaid")))return confirmPaid(v);
  if((v=q("[data-paid]","paid")))return paidSheet(v);
  if((v=q("[data-del-exp]","delExp")))return twoTap(T("[data-del-exp]"),()=>{remove("expenses",v)});
  if((v=q("[data-del-inc]","delInc")))return twoTap(T("[data-del-inc]"),()=>{remove("income",v)});
  if((v=q("[data-del-bill]","delBill")))return twoTap(T("[data-del-bill]"),()=>{remove("items",v)});
  const a=q("[data-act]","act");
  ({income:()=>incomeSheet(),add:()=>addSheet(),"new-bill":()=>editBill(),compare:compareSheet,"sheet-import":sheetImport,applepay:applePayImport,export:exportBackup,csv:exportCSV,cats:catSheet,restore}[a]||(()=>{}))();
});
document.addEventListener("input",e=>{if(e.target.id==="act-q"){S.q=e.target.value;document.getElementById("act-body").innerHTML=actBody()}});
document.addEventListener("change",e=>{if(e.target.id==="budget"){const b=num("budget");S.settings.budget=b>0?b:null;persist();toast(b>0?`Budget set to S$${nf0.format(b)}`:"Budget cleared")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("scrim").hidden)closeSheet()});
function setReveal(on){document.body.classList.toggle("reveal",on);const b=document.getElementById("eye");b.setAttribute("aria-pressed",String(on));b.setAttribute("aria-label",on?"Hide private amounts":"Show private amounts")}
document.getElementById("eye").addEventListener("click",()=>setReveal(!document.body.classList.contains("reveal")));
/* back in the app: pick up a new day, month or year since it was last open */
document.addEventListener("visibilitychange",()=>{if(document.hidden)return setReveal(false);const y=new Date().getFullYear();if(y!==YEAR){YEAR=y;S.actYear=null;S.actMonth=null}const n=autoLog();if(n)persist();render();if(n)toast(`Logged ${n} repeating payment${n===1?"":"s"}`)});
window.addEventListener("storage",ev=>{if(ev.key===KEY){load();render()}});

/* ================= start ================= */
load();setReveal(false);{const n=autoLog();if(n)persist();render();if(n)toast(`Logged ${n} repeating payment${n===1?"":"s"}`)}
(function(){const h=(location.hash||"").slice(1).toLowerCase();if(h==="log")addSheet();else if(h==="paynow")addSheet({method:"PayNow"});else if(h==="income")incomeSheet();
  if(h)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}})();
try{navigator.storage?.persist?.()}catch(e){}
if("serviceWorker" in navigator){const had=!!navigator.serviceWorker.controller;let r=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||r)return;r=true;location.reload()});window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
